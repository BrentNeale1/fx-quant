services:
  live-engine:
    build: .
    container_name: fx-quant-engine
    env_file:
      - config/.env
    environment:
      - PORT=8080
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
      - ./models:/app/models
    ports:
      - "8080:8080"
    restart: unless-stopped

  dashboard:
    build: .
    container_name: fx-quant-dashboard
    command: python src/dashboard.py
    env_file:
      - config/.env
    environment:
      - PORT=5000
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs:ro
      - ./templates:/app/templates:ro
    ports:
      - "5000:5000"
    restart: unless-stopped
